<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Pigeon body -->
  <ellipse cx="256" cy="280" rx="100" ry="80" fill="#94a3b8" opacity="0.9"/>
  <!-- Head -->
  <circle cx="310" cy="210" r="45" fill="#94a3b8"/>
  <!-- Eye -->
  <circle cx="325" cy="200" r="8" fill="#f97316"/>
  <circle cx="327" cy="198" r="3" fill="#0f172a"/>
  <!-- Beak -->
  <polygon points="350,210 380,215 350,220" fill="#fbbf24"/>
  <!-- Neck iridescence -->
  <ellipse cx="290" cy="240" rx="30" ry="25" fill="#7c3aed" opacity="0.4"/>
  <ellipse cx="290" cy="240" rx="25" ry="20" fill="#22d3ee" opacity="0.3"/>
  <!-- Wing -->
  <path d="M200,260 Q160,230 180,320 Q220,350 280,330 Q250,290 200,260Z" fill="#64748b"/>
  <!-- Wing bars -->
  <line x1="195" y1="280" x2="260" y2="310" stroke="#475569" stroke-width="3"/>
  <line x1="190" y1="295" x2="255" y2="325" stroke="#475569" stroke-width="3"/>
  <!-- Tail -->
  <polygon points="160,300 120,360 180,340" fill="#64748b"/>
  <!-- Scanning ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.6" stroke-dasharray="20 10"/>
  <!-- Corner dot indicators -->
  <circle cx="256" cy="56" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="456" cy="256" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="256" cy="456" r="6" fill="#22c55e" opacity="0.8"/>
  <circle cx="56" cy="256" r="6" fill="#22c55e" opacity="0.8"/>
</svg>
